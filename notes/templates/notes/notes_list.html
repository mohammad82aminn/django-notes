<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes</title>
</head>
<body>
    <h1>Notes</h1>

    {% for note in note_list %}
        <h2>{{note.author}}</h2>
        {{note.text}}<br>
        <p>----------------------</p>
    {%  empty %}
        <p> No notes yet. </p>
    {% endfor %}

</body>
</html>
