<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark">N</span>
                <span class="brand-name">Notes</span>
            </a>
            <span class="header-tagline">A tiny notebook built with Django</span>
        </div>
    </header>

    <main class="container">

        {% block context %}
        {% endblock %}

    </main>

    <footer class="site-footer">
        <div class="container">Built with Django &middot; Notes project</div>
    </footer>
</body>
</html>
